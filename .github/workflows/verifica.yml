name: Verifica
# Su ogni pull request GitHub prova il risultato dell'unione con main (non il ramo da solo):
# se due aggiornamenti funzionano da soli ma non insieme, la verifica fallisce prima che entrino in main.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:   # pulsante «Run workflow»: ripubblica il gioco a mano
concurrency:
  group: verifica-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dipendenze
        run: npm install --no-audit --no-fund
      - name: Browser per la prova
        # Prima solo il browser (circa 15 secondi). Le librerie di sistema, che richiedono apt e quindi la rete degli archivi Ubuntu, si installano solo se il browser
        # non parte: quando quella rete non risponde (succede) apt riprova per minuti, ed e' il motivo per cui la verifica durava 12 minuti invece di 2.
        run: |
          npx playwright install chromium
          if ! node -e "require('playwright').chromium.launch().then(b=>b.close()).catch(e=>{console.error(e.message.split('\n')[0]);process.exit(1);})"; then
            echo "::warning::Il browser non parte senza le librerie di sistema: le installo (puo' richiedere tempo se la rete e' lenta)"
            timeout 240 npx playwright install-deps chromium
          fi
      - name: Verifica completa
        run: npm test
      - name: Costruzione del gioco
        run: npm run build
      - name: Gioco pronto da scaricare
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-frisbee
          path: dist/ultimate-frisbee.html
          retention-days: 30

  # Pubblicazione: quando una modifica entra in main il gioco va sulla pagina web del repository (GitHub Pages), sempre allo stesso indirizzo.
  # Sulle pull request questo lavoro non parte. Non aspetta la verifica che gira in parallelo su main: la stessa verifica e' gia' passata sulla pull request,
  # che entra in main solo se verde e aggiornata (regola di protezione di main), quindi il risultato e' lo stesso albero di file. Prima di pubblicare
  # si rifanno comunque i controlli statici e la costruzione, che durano pochi secondi.
  pubblica:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Le pagine sono attive?
        id: pagine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then echo "attive=si" >> "$GITHUB_OUTPUT"
          else echo "::notice::Pubblicazione saltata: attiva Settings > Pages > Source: GitHub Actions, poi rilancia questo workflow."; fi
      - uses: actions/checkout@v4
        if: steps.pagine.outputs.attive == 'si'
      - uses: actions/setup-node@v4
        if: steps.pagine.outputs.attive == 'si'
        with:
          node-version: 22
      - name: Controlli statici
        if: steps.pagine.outputs.attive == 'si'
        run: node tools/check.js
      - name: Costruzione con la versione
        if: steps.pagine.outputs.attive == 'si'
        run: |
          export UF_BUILD="$(TZ=Europe/Rome date +'%d/%m/%Y %H:%M') · ${GITHUB_SHA::7}"
          npm run build
          mkdir -p _site && cp dist/ultimate-frisbee.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        if: steps.pagine.outputs.attive == 'si'
        with:
          path: _site
      - name: Pubblicazione
        id: deploy
        if: steps.pagine.outputs.attive == 'si'
        uses: actions/deploy-pages@v4
