<div id="cshell" class="hidden">
  <header id="ctop">
    <button type="button" class="ctclub" id="hClubBtn" aria-label="Il tuo club"><span id="hCrest"></span><span class="ctn"><b id="hEvt"></b><small id="hInfo"></small></span></button>
    <span class="ctgap"></span>
    <span class="ctcash" title="Crediti"><i class="coin"></i><b id="hCash">0</b></span>
    <button class="ibtn" id="hBell" type="button" aria-label="Posta"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3.5 11.5h9l-1.2-2V7a3.3 3.3 0 0 0-6.6 0v2.5zM7 14h2"/></svg><span>Posta</span><i class="bdg hidden" id="hBellB"></i></button>

    <button class="ibtn" id="hMenu" type="button" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg><span>Menu</span></button>
    <div id="cmenu" class="hidden" role="menu">
      <button class="cmi" id="hHelp" type="button" role="menuitem"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M5 6a3 3 0 1 1 4.4 2.6C8.5 9.1 8 9.6 8 10.6M8 13v.6"/></svg><span>Guida</span></button>
      <button class="cmi" id="hTut" type="button" role="menuitem"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M2 3h4.5A1.5 1.5 0 0 1 8 4.5V14a1.5 1.5 0 0 0-1.5-1.5H2zM14 3H9.5A1.5 1.5 0 0 0 8 4.5V14a1.5 1.5 0 0 1 1.5-1.5H14z"/></svg><span>Tutorial</span></button>
      <button class="cmi" id="hOpt" type="button" role="menuitem"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg><span>Opzioni</span></button>
      <button class="cmi" id="hBack" type="button" role="menuitem"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M6 3H3v10h3M7 8h7M11 5l3 3-3 3"/></svg><span>Menu principale</span></button>
    </div>
  </header>
  <nav id="rail" aria-label="Carriera">
    <button class="rb" id="hHome" type="button" data-s="home"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15L16 5l12 10M8 13v14h16V13M13 27v-7h6v7"/></svg><span><strong>Partita</strong></span></button>
    <button class="rb" id="hRoster" type="button" data-s="roster"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="4.2"/><circle cx="22" cy="12" r="3.4"/><path d="M3 26c0-5 3.5-8 8-8s8 3 8 8M17 26c.4-4 2.8-6.4 6-6.4 3 0 5 2 5.4 6.4"/></svg><span><strong>Squadra</strong><small id="hRosterS"></small></span><i class="bdg hidden" id="hRosterB">!</i></button>
    <button class="rb" id="hTrain" type="button" data-s="train"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M4 12v8M8 9v14M24 9v14M28 12v8M8 16h16"/></svg><span><strong>Allena</strong><small id="hTrainS"></small></span><i class="bdg ok hidden" id="hTrainB">!</i></button>
    <button class="rb" id="hMarket" type="button" data-s="market"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h24M6 12l2-6h16l2 6M7 12v14h18V12M13 26v-7h6v7"/></svg><span><strong>Mercato</strong><small id="hMarketS"></small></span><i class="bdg ok hidden" id="hMarketB">NEW</i></button>

    <button class="rb" id="hClub" type="button" data-s="club"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 28h24M6 28V13M26 28V13M3 13l13-9 13 9zM12 28v-9h8v9"/></svg><span><strong>Società</strong><small id="hClubS"></small></span></button>
